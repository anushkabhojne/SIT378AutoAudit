apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: allow-plugin-manager
  namespace: default

spec:
  
  podSelector:
    matchLabels:
      app: plugin-manager
  
  policyTypes:
    - Ingress
    - Egress
  
  ingress:
    
    - from:
        - podSelector:
            matchLabels:
              app: plugin
      
      ports:
        - protocol: TCP
          port: 8080
  
  egress:
    
    - to:
        - podSelector:
            matchLabels:
              app: plugin
      
      ports:
        - protocol: TCP
          port: 8080
