apiVersion: apps/v1
kind: Deployment

metadata:
  name: plugin-manager
  labels:
    app: plugin-manager

spec:
  replicas: 2
  selector:
    matchLabels:
      app: plugin-manager
  
  template:
    metadata:
      labels:
        app: plugin-manager
    
    spec:
      containers:
        - name: plugin-manager
          image: your-registry/plugin-manager:latest
          ports:
            - containerPort: 8080
          
          envFrom:
            - secretRef:
                name: plugin-manager-secrets
          
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            
            requests:
              cpu: "250m"
              memory: "256Mi"
          
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            
            initialDelaySeconds: 15
            periodSeconds: 20
      
      restartPolicy: Always
