#AutoAudit Configuration Management System - Pytest Configuration
#Comprehensive testing configuration for enterprise-grade test execution
#Supports unit testing, integration testing, performance testing, and security testing

[tool:pytest]

#Minimum pytest version required for compatibility
minversion = 7.0

#Testing the discovery patterns and paths
testpaths = 
    tests

#Python file patterns for test discovery
python_files = 
    test_*.py
    *_test.py
    tests.py

#Python class patterns for test discovery
python_classes = 
    Test*
    *Test
    *Tests
    *TestCase

#Python function patterns for test discovery
python_functions = 
    test_*
    *_test

#Command-line options applied to all test runs
addopts = 
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --showlocals
    --durations=10
    --cov=config
    --cov-branch
    --cov-report=term-missing:skip-covered
    --cov-report=html:reports/coverage/html
    --cov-report=xml:reports/coverage/coverage.xml
    --junitxml=reports/junit/junit.xml
    --html=reports/html/report.html
    --self-contained-html
    --asyncio-mode=auto
    --maxfail=5
    -ra

#Test markers for categorising and filtering tests
markers = 
    unit: Unit tests for individual components
    integration: Integration tests across multiple components
    performance: Performance and load testing
    security: Security and vulnerability testing
    database: Tests requiring database connectivity
    redis: Tests requiring Redis connectivity
    vault: Tests requiring HashiCorp Vault connectivity
    azure_ad: Tests requiring Azure AD authentication
    slow: Tests that take longer than 5 seconds
    fast: Tests that complete in under 1 second
    critical: Critical functionality tests
    regression: Regression testing for known issues
    smoke: Smoke tests for basic functionality
    api: API endpoint testing
    cache: Cache functionality testing
    encryption: Encryption and decryption testing
    validation: Configuration validation testing
    notification: Real-time notification testing
    monitoring: Metrics and monitoring testing
    compliance: Compliance and audit testing
    mock: Tests using mocked external dependencies
    real: Tests using real external services
    docker: Tests requiring Docker environment
    kubernetes: Tests requiring Kubernetes environment
    windows: Tests specific to Windows platform
    linux: Tests specific to Linux platform
    macos: Tests specific to macOS platform

#Asyncio configuration for async test support
asyncio_mode = auto

#Logging configuration during test execution
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s (%(filename)s:%(lineno)d)
log_cli_date_format = %Y-%m-%d %H:%M:%S

#File logging configuration for test runs
log_file = reports/logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s (%(filename)s:%(lineno)d)
log_file_date_format = %Y-%m-%d %H:%M:%S

#Warning filters to control test output noise
filterwarnings = 
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning
    ignore:.*urllib3.*:UserWarning
    ignore:.*aioredis.*:DeprecationWarning
    ignore:.*asyncio.*:DeprecationWarning
    ignore:.*distutils.*:UserWarning
    ignore:.*pkg_resources.*:DeprecationWarning

#Test collection configuration
collect_ignore = 
    setup.py
    conftest.py
    migrations/
    scripts/
    docs/
    .github/
    k8s/
    terraform/
    monitoring/

#Test execution configuration
timeout = 300
timeout_method = thread

#Parallel execution configuration
n = auto

#Coverage configuration integration
cov_config = .coveragerc
cov_context = test
cov_fail_under = 95

#Security testing configuration
bandit_config = .bandit
bandit_baseline = .bandit-baseline

#Performance testing configuration
benchmark_columns = min,max,mean,stddev,median,iqr,outliers,ops,rounds
benchmark_group_by = group,func,param
benchmark_sort = mean
benchmark_compare_fail = min:5%
benchmark_json = reports/benchmark/benchmark.json
benchmark_histogram = reports/benchmark/histogram.svg

#Hypothesis configuration for property-based testing
hypothesis_show_statistics = true
hypothesis_max_examples = 100
hypothesis_deadline = 5000
hypothesis_database = reports/hypothesis/.hypothesis/examples

#Test environment variables
env = 
    ENVIRONMENT = test
    LOG_LEVEL = DEBUG
    CACHE_TTL = 60
    TESTING = true

#Django-style test database configuration (if needed)
DJANGO_SETTINGS_MODULE = config.settings.test

#Test data management
tmp_path_retention_count = 3
tmp_path_retention_policy = all

#Plugin configuration
plugins = 
    pytest-asyncio
    pytest-cov
    pytest-html
    pytest-mock
    pytest-xdist
    pytest-benchmark
    pytest-timeout
    pytest-randomly
    pytest-sugar
    pytest-clarity
    pytest-instafail

#Custom test execution hooks
python_paths = 
    .
    config
    tests

#Test report configuration
html_report_title = AutoAudit Configuration Management System Test Report
html_report_description = Comprehensive test results for enterprise configuration management
html_report_extra_summary = 
    Environment: Test
    Version: 1.0.0
    Build: CI/CD Pipeline

#JUnit XML configuration for CI/CD integration
junit_suite_name = AutoAudit Configuration Management Tests
junit_logging = system-out
junit_log_passing_tests = true
junit_duration_report = total
junit_family = xunit2

#Test discovery and execution optimization
cache_dir = reports/pytest_cache
consider_namespace_packages = true
doctest_optionflags = NORMALIZE_WHITESPACE IGNORE_EXCEPTION_DETAIL
doctest_encoding = utf-8

#Custom test configuration for different environments
[tool:pytest.env:ci]
addopts = 
    --strict-markers
    --tb=line
    --maxfail=1
    --cov-fail-under=95
    --junitxml=reports/junit/junit.xml
    -x

[tool:pytest.env:local]
addopts = 
    --verbose
    --tb=short
    --showlocals
    --no-header
    --tb=auto

[tool:pytest.env:debug]
addopts = 
    -vvv
    --tb=long
    --showlocals
    --capture=no
    --log-cli-level=DEBUG

#Integration test configuration
[tool:pytest.integration]
markers = 
    database
    redis
    vault
    azure_ad
    real_services

required_plugins = 
    pytest-docker
    pytest-postgresql
    testcontainers

#Performance test configuration
[tool:pytest.performance]
markers = 
    load_test
    stress_test
    benchmark

timeout = 600
benchmark_disable_gc = true
benchmark_warmup = true
benchmark_warmup_iterations = 3

#Security test configuration
[tool:pytest.security]
markers = 
    security
    vulnerability
    penetration

required_plugins = 
    pytest-bandit
    pytest-safety