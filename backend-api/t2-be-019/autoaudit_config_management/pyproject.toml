#AutoAudit Configuration Management System - Modern Python Project Configuration
#This pyproject.toml provides comprehensive build system configuration, tool settings,
#and development environment specifications for enterprise-grade Python development
#following PEP 518 standards and modern Python packaging best practices.

[build-system]
requires = [
    "setuptools>=65.0",
    "setuptools-scm>=7.0",
    "wheel>=0.38.0",
    "build>=0.8.0"
]

build-backend = "setuptools.build_meta"

[project]
name = "autoaudit-config-management"
version = "1.0.0"
description = "Enterprise-grade centralised configuration management system for AutoAudit microservices ecosystem"
readme = "README.md"

keywords = [
    "configuration", "management", "microservices", "enterprise", "autoaudit",
    "fastapi", "postgresql", "redis", "kubernetes", "docker", "security",
    "compliance", "monitoring", "automation", "devops", "cloud-native"
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators", 
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Security :: Cryptography",
    "Framework :: FastAPI",
    "Framework :: AsyncIO",
    "Environment :: Web Environment",
    "Natural Language :: English"
]

requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "asyncpg>=0.29.0",
    "redis[hiredis]>=5.0.1",
    "cryptography>=41.0.8",
    "pyjwt[crypto]>=2.8.0",
    "pydantic[email]>=2.5.0",
    "prometheus-client>=0.19.0",
    "structlog>=23.2.0",
    "httpx>=0.25.2",
    "python-dotenv>=1.0.0",
    "click>=8.1.7"
]
dynamic = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "black>=23.11.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.7.1",
    "bandit>=1.7.5",
    "safety>=2.3.5",
    "pre-commit>=3.5.0"
]

production = [
    "gunicorn>=21.2.0",
    "gevent>=23.9.1",
    "setproctitle>=1.3.3"
]

monitoring = [
    "opentelemetry-api>=1.21.0",
    "opentelemetry-sdk>=1.21.0",
    "opentelemetry-instrumentation-fastapi>=0.42b0",
    "opentelemetry-exporter-jaeger-thrift>=1.21.0"
]

security = [
    "hvac>=2.0.0",
    "azure-keyvault-secrets>=4.7.0",
    "passlib[bcrypt]>=1.7.4"
]

testing = [
    "testcontainers>=3.7.1",
    "locust>=2.17.0",
    "httpie>=3.2.2"
]

docs = [
    "sphinx>=7.2.6",
    "sphinx-rtd-theme>=1.3.0",
    "mkdocs-material>=9.4.8"
]

[project.scripts]
autoaudit-config = "config.cli:main"
autoaudit-config-server = "config.main:run_server"
autoaudit-config-migrate = "config.database.migrate:main"
autoaudit-config-admin = "config.admin.cli:main"

#Black Code Formatting Configuration
[tool.black]
line-length = 88
target-version = ['py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | migrations/versions
)/
'''
preview = true
safe = true

#isort Import Sorting Configuration
[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["config", "tests"]

known_third_party = [
    "fastapi", "uvicorn", "asyncpg", "redis", "pydantic", "sqlalchemy",
    "prometheus_client", "structlog", "pytest", "httpx", "cryptography"
]

sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
force_sort_within_sections = true
show_diff = true

#MyPy Type Checking Configuration
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_optional = true
strict_equality = true
no_implicit_optional = true
disallow_any_generics = true
disallow_any_unimported = false
disallow_any_expr = false
disallow_any_decorated = false
disallow_any_explicit = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_reexport = true
show_error_codes = true
show_error_context = true
pretty = true
color_output = true

[[tool.mypy.overrides]]

module = [
    "redis.*",
    "asyncpg.*",
    "prometheus_client.*",
    "structlog.*",
    "uvicorn.*",
    "gunicorn.*",
    "testcontainers.*"
]
ignore_missing_imports = true

#Pytest Testing Configuration
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*", "*Tests"]
python_functions = ["test_*"]

addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "--cov=config",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html:reports/coverage",
    "--cov-report=xml:reports/coverage.xml",
    "--junitxml=reports/junit.xml",
    "--asyncio-mode=auto",
    "--maxfail=3"
]

markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "performance: Performance tests",
    "security: Security tests",
    "slow: Slow running tests (>5 seconds)",
    "requires_database: Tests requiring database connection",
    "requires_redis: Tests requiring Redis connection",
    "requires_vault: Tests requiring HashiCorp Vault",
    "requires_docker: Tests requiring Docker environment"
]

asyncio_mode = "auto"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(name)s: %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::UserWarning:.*urllib3.*",
]

#Coverage.py Configuration
[tool.coverage.run]
source = ["config"]
branch = true

omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/venv/*",
    "*/.venv/*",
    "*/virtualenvs/*",
    "*/__pycache__/*",
    "*/node_modules/*",
    "setup.py",
    "conftest.py"
]

parallel = true
concurrency = ["thread", "greenlet"]

[tool.coverage.report]

exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "@overload"
]

ignore_errors = true
show_missing = true
skip_covered = false
precision = 2
sort = "Cover"

[tool.coverage.html]
directory = "reports/coverage"
show_contexts = true

[tool.coverage.xml]
output = "reports/coverage.xml"

#Bandit Security Scanning Configuration
[tool.bandit]
exclude_dirs = ["tests", "migrations", "scripts"]
tests = ["B101", "B102", "B103", "B104", "B105", "B106", "B107", "B110", "B112", "B201", "B301", "B302", "B303", "B304", "B305", "B306", "B307", "B308", "B309", "B310", "B311", "B312", "B313", "B314", "B315", "B316", "B317", "B318", "B319", "B320", "B321", "B322", "B323", "B324", "B325", "B401", "B402", "B403", "B404", "B405", "B406", "B407", "B408", "B409", "B410", "B411", "B412", "B413", "B501", "B502", "B503", "B504", "B505", "B506", "B507", "B601", "B602", "B603", "B604", "B605", "B606", "B607", "B608", "B609", "B610", "B611", "B701", "B702", "B703"]
skips = ["B101", "B601"]  # Skip assert_used and shell_injection for test files

[tool.bandit.assert_used]
skips = ["*/tests/*", "*test*.py"]

#Flake8 Linting Configuration (in setup.cfg format for compatibility)
[tool.flake8]
max-line-length = 88

extend-ignore = [
    "E203",  #Whitespace before ':' (conflicts with Black)
    "E501",  #Line too long (handled by Black)
    "W503",  #Line break before binary operator (prefer W504)
    "F401"   #Module imported but unused (handled by isort and mypy)
]

exclude = [
    ".git",
    "__pycache__",
    "docs/source/conf.py",
    "old",
    "build",
    "dist",
    "migrations/versions",
    ".venv",
    "venv",
    ".tox",
    ".mypy_cache",
    ".pytest_cache"
]

per-file-ignores = [
    "__init__.py:F401",
    "tests/*:S101,S105,S106"
]

max-complexity = 10
docstring-convention = "google"
import-order-style = "google"

#Ruff Linting Configuration (Alternative to Flake8)
[tool.ruff]
target-version = "py311"
line-length = 88

select = [
    "E",   #pycodestyle errors
    "W",   #pycodestyle warnings  
    "F",   #pyflakes
    "I",   #isort
    "B",   #flake8-bugbear
    "C4",  #flake8-comprehensions
    "UP",  #pyupgrade
    "S",   #bandit
    "T20", #flake8-print
    "SIM", #flake8-simplify
    "PTH", #flake8-use-pathlib
]

ignore = [
    "E501",  #Line too long (handled by Black)
    "B008",  #Do not perform function calls in argument defaults
    "S101",  #Use of assert detected (acceptable in tests)
    "T201",  #Print found (acceptable for CLI tools)
]

exclude = [
    ".bzr",
    ".direnv", 
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "migrations/versions"
]

unfixable = ["F401"]  #Don't auto-remove unused imports

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101", "S105", "S106", "PLR2004"]

[tool.ruff.isort]
known-first-party = ["config", "tests"]
force-sort-within-sections = true

[tool.ruff.flake8-tidy-imports]
ban-relative-imports = "all"

#Commitizen Configuration for Conventional Commits
[tool.commitizen]
name = "cz_conventional_commits"
version = "1.0.0"
tag_format = "v$major.$minor.$patch"

version_files = [
    "config/__init__.py:__version__",
    "pyproject.toml:version"
]

bump_message = "bump: version $current_version → $new_version"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
changelog_format = "markdown"
changelog_merge_prerelease = false

style = [
    ["qmark", "fg:#ff9d00 bold"],
    ["question", "bold"],
    ["answer", "fg:#ff9d00 bold"],
    ["pointer", "fg:#ff9d00 bold"],
    ["highlighted", "fg:#ff9d00 bold"],
    ["selected", "fg:#cc5454"],
    ["separator", "fg:#cc5454"],
    ["instruction", ""],
    ["text", ""],
    ["disabled", "fg:#858585 italic"]
]